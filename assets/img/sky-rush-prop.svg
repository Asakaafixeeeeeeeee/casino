<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="100" height="100">
  <!-- Sky Rush propeller: three red blades with cream tips around a chrome hub (the loading mark and the tab icon) -->
  <defs>
    <linearGradient id="spBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f0820"/>
      <stop offset=".45" stop-color="#ff2b4b"/>
      <stop offset=".6" stop-color="#e50539"/>
      <stop offset="1" stop-color="#7d0619"/>
    </linearGradient>
    <radialGradient id="spHub" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#cfd5de"/>
      <stop offset="1" stop-color="#4b525e"/>
    </radialGradient>
    <g id="spOne">
      <path d="M-5.2 -8 C-7.4 -22 -6.6 -36 -3.6 -45.5 Q0 -49.4 3.6 -45.5 C6.6 -36 7.4 -22 5.2 -8 Z" fill="url(#spBlade)" stroke="#4d0311" stroke-width="1"/>
      <path d="M-4.6 -37.6 C-4 -41.6 -3.2 -44 -2.2 -45.6 Q0 -47.8 2.2 -45.6 C3.2 -44 4 -41.6 4.6 -37.6 C1.6 -38.6 -1.6 -38.6 -4.6 -37.6 Z" fill="#f4efe6"/>
      <path d="M-1.6 -12 C-2.4 -22 -2 -32 -0.8 -40" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
    </g>
  </defs>
  <use href="#spOne"/>
  <use href="#spOne" transform="rotate(120)"/>
  <use href="#spOne" transform="rotate(240)"/>
  <circle r="11" fill="url(#spHub)" stroke="#3d434d" stroke-width="1.2"/>
  <circle r="4" fill="#2a2e35"/>
  <circle cx="-3" cy="-3.4" r="2.4" fill="#fff" opacity=".7"/>
</svg>
