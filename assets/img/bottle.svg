<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="600" height="200">
  <!-- Rendo Bottle: a green glass bottle lying on its side, seen from above, neck pointing right (0°).
       The glass is partly see-through, so the table shows through it. The bottle is symmetric across its width, and
       its lighting is drawn twice — lit from the top edge, and mirrored, lit from the bottom edge. The game sets the CSS variable
       light-a (1 = lamp above the top edge, 0 = above the bottom edge) as the bottle turns, so the glare always
       faces the lamp. As a plain image it falls back to being lit from the top edge. -->
  <defs>
    <!-- glass across the width: dark rims, a clearer middle -->
    <linearGradient id="btGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#022410" stop-opacity=".97"/>
      <stop offset=".07" stop-color="#0a5524" stop-opacity=".9"/>
      <stop offset=".24" stop-color="#1e8a3f" stop-opacity=".58"/>
      <stop offset=".5" stop-color="#2a9a4c" stop-opacity=".4"/>
      <stop offset=".76" stop-color="#1e8a3f" stop-opacity=".58"/>
      <stop offset=".93" stop-color="#0a5524" stop-opacity=".9"/>
      <stop offset="1" stop-color="#022410" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="btLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#857247"/>
      <stop offset=".13" stop-color="#e3d4ab"/>
      <stop offset=".5" stop-color="#fdf6e6"/>
      <stop offset=".87" stop-color="#e3d4ab"/>
      <stop offset="1" stop-color="#857247"/>
    </linearGradient>
    <linearGradient id="btFoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e3604"/>
      <stop offset=".2" stop-color="#b8861a"/>
      <stop offset=".5" stop-color="#f0cd6a"/>
      <stop offset=".8" stop-color="#b8861a"/>
      <stop offset="1" stop-color="#4e3604"/>
    </linearGradient>
    <linearGradient id="btBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6b38"/>
      <stop offset="1" stop-color="#0b3d1d"/>
    </linearGradient>
    <filter id="btSoft" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation=".7"/></filter>
    <filter id="btSofter" x="-5%" y="-80%" width="110%" height="260%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="btBodyClip">
      <path d="M30 20H180C198 20 210 30 226 38V62C210 70 198 80 180 80H30Q12 80 12 64V36Q12 20 30 20Z"/>
    </clipPath>

    <!-- light on the glass, with the lamp above the top edge: glare near that edge, the caustic glow near the far one -->
    <g id="btGlareGlass">
      <g clip-path="url(#btBodyClip)">
        <rect x="26" y="23.5" width="160" height="10" rx="5" fill="#fff" opacity=".2" filter="url(#btSofter)"/>
        <path d="M34 72.5H178" stroke="#d2ffdc" stroke-width="3.2" stroke-linecap="round" opacity=".5" filter="url(#btSofter)"/>
      </g>
      <path d="M33 26.3H178C191 26.5 203 32 216 38.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".9" filter="url(#btSoft)"/>
      <path d="M229 41.6H270" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".85" filter="url(#btSoft)"/>
      <path d="M229 58.8H270" stroke="#b8f5c4" stroke-width="1.6" stroke-linecap="round" opacity=".4" filter="url(#btSoft)"/>
      <path d="M274.5 38.6H283.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
      <path d="M184 76.5C197 74 208 69 220 62.6" fill="none" stroke="#c4f7cf" stroke-width="2" stroke-linecap="round" opacity=".35" filter="url(#btSoft)"/>
    </g>
    <!-- light on the label and foil, same lamp -->
    <g id="btGlareLabel">
      <path d="M68 31.5H156" stroke="#fff" stroke-width="3" opacity=".3" filter="url(#btSoft)"/>
      <path d="M68 70H156" stroke="#5c4a26" stroke-width="3" opacity=".12" filter="url(#btSoft)"/>
      <path d="M236 41.2H272" stroke="#fff6d0" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
    </g>
  </defs>

  <!-- glass: body and shoulder, neck, and the lip ring, each shaded across its own width -->
  <path d="M30 20H180C198 20 210 30 226 38V62C210 70 198 80 180 80H30Q12 80 12 64V36Q12 20 30 20Z" fill="url(#btGlass)"/>
  <path d="M225 38H273V62H225Z" fill="url(#btGlass)"/>
  <rect x="271.5" y="35" width="14.5" height="30" rx="4" fill="url(#btGlass)"/>

  <!-- glass lighting: lamp above the top edge, and mirrored for a lamp above the bottom edge -->
  <g style="opacity: var(--light-a, 1)"><use href="#btGlareGlass"/></g>
  <g style="opacity: calc(1 - var(--light-a, 1))"><use href="#btGlareGlass" transform="translate(0 100) scale(1 -1)"/></g>

  <!-- the thick glass base and its punt -->
  <ellipse cx="16" cy="50" rx="4.5" ry="26" fill="#011a09" opacity=".55"/>
  <path d="M21.5 29Q15.5 50 21.5 71" fill="none" stroke="#fff" stroke-width="1.3" opacity=".3"/>

  <!-- paper label wrapped round the bottle: darker where it curves away, a dark-green badge with the R mark -->
  <rect x="66" y="20.6" width="92" height="58.8" fill="url(#btLabel)"/>
  <path d="M66 20.6V79.4M158 20.6V79.4" stroke="#6e5c35" stroke-width=".9" opacity=".7"/>
  <path d="M66 26.2H158M66 73.8H158" stroke="#c49a2c" stroke-width="1.4"/>
  <ellipse cx="112" cy="50" rx="27" ry="17.5" fill="url(#btBadge)" stroke="#d9ad3c" stroke-width="1.6"/>
  <g transform="translate(112 50) scale(.47) skewX(-12) translate(-31.5 -32)" fill="#f2c94c">
    <path d="M21.5 13V51 M21.5 17.2H35Q42 17.2 42 24.2V26.3Q42 33.3 35 33.3H21.5" fill="none" stroke="#f2c94c"
          stroke-width="7.4" stroke-linejoin="miter" stroke-miterlimit="2"/>
    <path d="M26.9 33.3H34.7L45 51H37.2Z"/>
  </g>

  <!-- gold foil on the neck, crinkled -->
  <path d="M235 37.4H273V62.6H235Z" fill="url(#btFoil)"/>
  <g stroke="#5a3e05" stroke-width=".7" opacity=".45">
    <path d="M240 37.6L241 62.4M246.5 37.6L245.5 62.4M252 37.6L253 62.4M258.5 37.6L257.8 62.4M264.5 37.6L265.2 62.4"/>
  </g>
  <path d="M235 37.4V62.6" stroke="#3d2a02" stroke-width="1.2"/>

  <!-- label and foil lighting, both ways -->
  <g style="opacity: var(--light-a, 1)"><use href="#btGlareLabel"/></g>
  <g style="opacity: calc(1 - var(--light-a, 1))"><use href="#btGlareLabel" transform="translate(0 100) scale(1 -1)"/></g>

  <!-- crisp glass edges -->
  <path d="M30 20H180C198 20 210 30 226 38H273V62H226C210 70 198 80 180 80H30Q12 80 12 64V36Q12 20 30 20Z"
        fill="none" stroke="#011d0a" stroke-width="1.1" opacity=".85"/>
  <rect x="271.5" y="35" width="14.5" height="30" rx="4" fill="none" stroke="#011d0a" stroke-width="1.1" opacity=".85"/>
</svg>
