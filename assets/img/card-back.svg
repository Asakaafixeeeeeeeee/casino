<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350">
  <!-- RendoWin card back: a white border round a red panel with a fine lattice, double gold frame lines,
       corner diamonds, and the RendoWin R mark on a cream medallion -->
  <defs>
    <radialGradient id="cbRed" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#e5343b"/>
      <stop offset=".6" stop-color="#b3121b"/>
      <stop offset="1" stop-color="#76070e"/>
    </radialGradient>
    <pattern id="cbLattice" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 6H12M6 0V12" stroke="#ff9a8f" stroke-width="1.1" opacity=".32"/>
      <circle cx="6" cy="6" r="1.4" fill="#ffd36b" opacity=".35"/>
    </pattern>
    <linearGradient id="cbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe55c"/>
      <stop offset=".5" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <radialGradient id="cbCream" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#efe3c2"/>
    </radialGradient>
    <linearGradient id="cbSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- trims the V's arms flat along the top, as in the brand mark -->
  </defs>

  <!-- card stock and the printed panel -->
  <rect width="250" height="350" rx="16" fill="#fbf9f3"/>
  <rect x="12" y="12" width="226" height="326" rx="9" fill="url(#cbRed)"/>
  <rect x="12" y="12" width="226" height="326" rx="9" fill="url(#cbLattice)"/>
  <rect x="21" y="21" width="208" height="308" rx="6" fill="none" stroke="#ffd36b" stroke-width="2" opacity=".8"/>
  <rect x="26.5" y="26.5" width="197" height="297" rx="4" fill="none" stroke="#ffd36b" stroke-width=".8" opacity=".55"/>
  <g fill="#ffd36b" opacity=".85">
    <path d="M40 32l6 8-6 8-6-8z"/><path d="M210 32l6 8-6 8-6-8z"/>
    <path d="M40 302l6 8-6 8-6-8z"/><path d="M210 302l6 8-6 8-6-8z"/>
  </g>

  <!-- medallion with the RendoWin mark -->
  <circle cx="125" cy="152" r="54" fill="#5a0509" opacity=".45"/>
  <circle cx="125" cy="150" r="49" fill="url(#cbCream)" stroke="#ffd36b" stroke-width="3.5"/>
  <circle cx="125" cy="150" r="42.5" fill="none" stroke="#b3121b" stroke-width="1.2" opacity=".6"/>
  <g transform="translate(125 150) scale(1.02) translate(-32 -32)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cbGold)" stroke="#d98300" stroke-width="1.5"/>
    <g transform="translate(32 32) skewX(-12) translate(-32 -32)" fill="#151515">
      <path d="M21.5 13V51 M21.5 17.2H35Q42 17.2 42 24.2V26.3Q42 33.3 35 33.3H21.5" fill="none" stroke="#151515"
            stroke-width="8.4" stroke-linejoin="miter" stroke-miterlimit="2"/>
      <path d="M26.4 33.3H35.2L45.5 51H36.7Z"/>
    </g>
  </g>

  <!-- a soft sheen across the coated stock -->
  <rect width="250" height="350" rx="16" fill="url(#cbSheen)"/>
</svg>
