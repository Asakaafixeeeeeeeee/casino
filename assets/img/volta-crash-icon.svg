<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- Rendo Crash emblem: the game screen in miniature — a glowing take-off curve with the plane climbing away -->
  <defs>
    <radialGradient id="bg" cx=".12" cy=".95" r="1.05">
      <stop offset="0" stop-color="#5e0b21"/>
      <stop offset=".55" stop-color="#17080d"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </radialGradient>
    <linearGradient id="planeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f80"/>
      <stop offset=".55" stop-color="#ff1744"/>
      <stop offset="1" stop-color="#a8002a"/>
    </linearGradient>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="13"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#ff1744" flood-opacity=".7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#ff1744" stroke-opacity=".75" stroke-width="2"/>

  <!-- faint sun rays from the take-off corner, as on the game screen -->
  <g clip-path="url(#tile)" fill="#fff" opacity=".07">
    <path d="M6 58L18 0H30Z"/><path d="M6 58L46 0H62Z"/><path d="M6 58L64 18V31Z"/><path d="M6 58L64 46V55Z"/>
  </g>

  <!-- the take-off curve -->
  <path d="M9 54Q29 54 38 31" fill="none" stroke="#ff1744" stroke-width="3.4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- the plane at the tip of the curve -->
  <g transform="translate(37.6 32) rotate(-66) scale(1.3) translate(-1.4 -4.8)" filter="url(#glow)">
    <path d="M5 4.2L3 1.4Q2.7 1 2.2 1L1.1 1Q.7 1 .7 1.4L1 4.6Z" fill="#d50032"/>
    <path d="M1.4 4.5C5 4.1 9 3.7 11.8 3.6L17.6 3.5C19.2 3.5 20.3 3.9 20.8 4.5L20.8 5.9C20.3 6.4 19.2 6.7 17.6 6.7
             C14 6.7 10 6.4 6.6 5.9C4.2 5.5 2.4 5.2 1.4 5Z" fill="url(#planeBody)"/>
    <path d="M2.4 4.85C6 4.67 11 4.5 17.6 4.5L20.5 4.58V4.98L17.6 5C11 5.02 6 5.18 2.4 5.22Z" fill="#fff" opacity=".9"/>
    <path d="M12 3.6C12.6 2.2 14.6 1.7 16.2 2.2C17 2.5 17.5 3 17.7 3.5Z" fill="#bfe3ff"/>
    <path d="M16.2 6.15L10.6 6.05L8.25 8.6Q7.95 9.1 8.6 9.1L11 9.1L17.2 6.55Z" fill="#b0002a"/>
    <path d="M20.8 4.45C22 4.6 22.8 4.95 23.3 5.2C22.8 5.45 22 5.8 20.8 5.95Z" fill="#e3e7ee"/>
  </g>
</svg>
