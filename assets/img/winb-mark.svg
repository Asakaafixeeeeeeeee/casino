  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe55c"/>
      <stop offset=".5" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gold)" stroke="#d98300" stroke-width="1.5"/>
  <path d="M6 9Q32 3 58 9V22Q32 15 6 22Z" fill="#fff" opacity=".12"/>
  <g transform="translate(32 32) skewX(-12) translate(-32 -32)" fill="#151515">
