<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 207 40" width="414" height="80">
  <!-- Rendo Crash wordmark. Letters are drawn as strokes (not font text), so the logo renders the same everywhere.
       A flight trail runs low under the name, then climbs into the plane — the game's take-off curve. -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3c8d3"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a86"/>
      <stop offset=".5" stop-color="#ff1744"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e91e63" stop-opacity="0"/>
      <stop offset=".4" stop-color="#e91e63" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="planeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f80"/>
      <stop offset=".55" stop-color="#ff1744"/>
      <stop offset="1" stop-color="#a8002a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#ff1744" flood-opacity=".65"/>
    </filter>

    <!-- heavy geometric letterforms on a 20-unit cap height, stroke 5 -->
    <path id="rendo" d="M2.5 0V20 M2.5 2.5H9.5Q11.5 2.5 11.5 4.5V9Q11.5 11 9.5 11H2.5
      M19.6 0V20 M19.6 2.5H29.1 M19.6 10H27.6 M19.6 17.5H29.1
      M34.1 0V20 M43.1 0V20
      M50.6 0V20 M50.6 2.5H55.6Q59.6 2.5 59.6 6.5V13.5Q59.6 17.5 55.6 17.5H50.6
      M69.1 2.5H74.1Q76.1 2.5 76.1 4.5V15.5Q76.1 17.5 74.1 17.5H69.1Q67.1 17.5 67.1 15.5V4.5Q67.1 2.5 69.1 2.5Z"/>
    <path id="rendoFill" d="M5.2 11H10.4L14.6 20H9.4Z M31.6 0H36.8L45.6 20H40.4Z"/>
    <path id="crash" d="M93.5 2.5H85Q83 2.5 83 4.5V15.5Q83 17.5 85 17.5H93.5
      M98.5 20V2.5H105.5Q107.5 2.5 107.5 4.5V9Q107.5 11 105.5 11H98.5 M103 11L107.5 15.5V20
      M115 20V6Q115 2.5 118.5 2.5H120.5Q124 2.5 124 6V20 M115 12H124
      M142 2.5H133.5Q131.5 2.5 131.5 4.5V8Q131.5 10 133.5 10H137.5Q139.5 10 139.5 12V15.5Q139.5 17.5 137.5 17.5H129
      M147 0V20 M156 0V20 M147 10H156"/>
  </defs>

  <!-- flight trail: low under the name, then a steep climb -->
  <path d="M3 29.2C120 29.2 160.6 26.6 182.1 9.2L183.8 11C163.4 29.2 120 31.2 3 31.2Z" fill="url(#trail)"/>

  <!-- the name, italicised; a dark copy offset behind it gives the letters depth -->
  <g transform="translate(9 2) skewX(-12)" stroke-width="5" stroke-linejoin="miter" stroke-miterlimit="2" fill="none">
    <g transform="translate(1.2 1.5)" stroke="#4a0012">
      <use href="#rendo"/><use href="#crash" transform="translate(5.1 0)"/>
      <use href="#rendoFill" fill="#4a0012" stroke="none"/>
    </g>
    <use href="#rendo" stroke="url(#silver)"/>
    <use href="#rendoFill" fill="url(#silver)" stroke="none"/>
    <use href="#crash" transform="translate(5.1 0)" stroke="url(#red)" filter="url(#glow)"/>
  </g>

  <!-- the plane at the top of the climb (a simplified version of the game's plane) -->
  <g transform="translate(182.1 9.6) rotate(-32) translate(-1.4 -4.8)" filter="url(#glow)">
    <path d="M5 4.2L3 1.4Q2.7 1 2.2 1L1.1 1Q.7 1 .7 1.4L1 4.6Z" fill="#d50032"/>
    <path d="M1.4 4.5C5 4.1 9 3.7 11.8 3.6L17.6 3.5C19.2 3.5 20.3 3.9 20.8 4.5L20.8 5.9C20.3 6.4 19.2 6.7 17.6 6.7
             C14 6.7 10 6.4 6.6 5.9C4.2 5.5 2.4 5.2 1.4 5Z" fill="url(#planeBody)"/>
    <path d="M2.4 4.85C6 4.67 11 4.5 17.6 4.5L20.5 4.58V4.98L17.6 5C11 5.02 6 5.18 2.4 5.22Z" fill="#fff" opacity=".9"/>
    <path d="M12 3.6C12.6 2.2 14.6 1.7 16.2 2.2C17 2.5 17.5 3 17.7 3.5Z" fill="#bfe3ff"/>
    <path d="M16.2 6.15L10.6 6.05L8.25 8.6Q7.95 9.1 8.6 9.1L11 9.1L17.2 6.55Z" fill="#b0002a"/>
    <path d="M20.8 4.45C22 4.6 22.8 4.95 23.3 5.2C22.8 5.45 22 5.8 20.8 5.95Z" fill="#e3e7ee"/>
  </g>
</svg>
